<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="stylesheet" href="styles.css" id="app-css" />
  <title>Sumo Inventory</title>
</head>
<body>
  <div id="app"><div class="loading">Loading&#8230;</div></div>
  <script>
    // Always fetch the newest code: iOS home-screen web apps cache
    // aggressively, so bust the cache on every launch.
    (function () {
      var v = Date.now();
      var css = document.getElementById("app-css");
      if (css) css.href = "styles.css?v=" + v;
      var s = document.createElement("script");
      s.src = "app.js?v=" + v;
      s.onerror = function () {
        var el = document.querySelector("#app .loading");
        if (el) el.textContent = "Failed to load. Check your connection and reopen.";
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
