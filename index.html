<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sumo Sushi Warm Springs" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="stylesheet" href="styles.css" id="app-css" />
  <title>Sumo Sushi Warm Springs</title>
</head>
<body>
  <div id="app"><div class="loading">Loading&#8230;</div></div>
  <script>
    // Version-stamped cache busting: the phone caches app.js/styles.css
    // between deploys (fast launches) and fetches fresh code whenever
    // APP_V changes. Bump APP_V on every frontend deploy.
    var APP_V = "20261004a";
    (function () {
      var css = document.getElementById("app-css");
      if (css) css.href = "styles.css?v=" + APP_V;
      var s = document.createElement("script");
      s.src = "app.js?v=" + APP_V;
      s.onerror = function () {
        var el = document.querySelector("#app .loading");
        var es = (navigator.language || "").toLowerCase().indexOf("es") === 0;
        if (el) el.textContent = es
          ? "No se pudo cargar. Revisa tu conexión y vuelve a abrir."
          : "Failed to load. Check your connection and reopen.";
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
